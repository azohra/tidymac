<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">TidyMac</title>
  <desc id="desc">Your Mac is hoarding. TidyMac finds out why, turning storage evidence into clear cleanup decisions.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171916"/>
      <stop offset="1" stop-color="#242720"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5f7ef"/>
      <stop offset="0.54" stop-color="#f5f7ef"/>
      <stop offset="0.55" stop-color="#78dfa3"/>
      <stop offset="1" stop-color="#a7f3c6"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#78dfa3" stop-opacity=".16"/>
      <stop offset="1" stop-color="#78dfa3" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <path d="M0 350C220 285 370 420 610 338S980 278 1200 338v82H0z" fill="#2c3028" opacity=".55"/>
  <circle cx="947" cy="205" r="230" fill="url(#glow)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(74 74)">
      <rect width="252" height="34" rx="17" fill="#2d332c" stroke="#465046"/>
      <circle cx="20" cy="17" r="5" fill="#78dfa3"/>
      <text x="34" y="22" fill="#b9c1b6" font-size="13" font-weight="700" letter-spacing="1.8">MAC STORAGE, EXPLAINED</text>
    </g>

    <text x="70" y="207" fill="url(#wordmark)" font-size="96" font-weight="780" letter-spacing="-5">TidyMac</text>
    <text x="74" y="258" fill="#f1f3ec" font-size="26" font-weight="650">Your Mac is hoarding. Find out why.</text>
    <text x="74" y="300" fill="#aeb5aa" font-size="19">Deep investigation. Decisive cleanup. Nothing changes</text>
    <text x="74" y="328" fill="#aeb5aa" font-size="19">until you approve the exact action.</text>

    <g transform="translate(940 210)" filter="url(#shadow)">
      <circle r="127" fill="#1c1f1a" stroke="#363b33" stroke-width="2"/>
      <circle r="101" fill="none" stroke="#343932" stroke-width="18"/>
      <circle r="101" fill="none" stroke="#65cc8e" stroke-width="18" stroke-linecap="round" stroke-dasharray="330 635" transform="rotate(-90)"/>
      <circle r="73" fill="none" stroke="#343932" stroke-width="17"/>
      <circle r="73" fill="none" stroke="#f3c969" stroke-width="17" stroke-linecap="round" stroke-dasharray="190 459" transform="rotate(-32)"/>
      <circle r="46" fill="none" stroke="#343932" stroke-width="16"/>
      <circle r="46" fill="none" stroke="#b9a4ff" stroke-width="16" stroke-linecap="round" stroke-dasharray="118 289" transform="rotate(42)"/>

      <g transform="translate(-20 -24)" fill="none" stroke="#edf2e9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <rect width="40" height="48" rx="7"/>
        <path d="M8 34h24M13 41h14" opacity=".72"/>
        <circle cx="30" cy="12" r="2" fill="#78dfa3" stroke="none"/>
      </g>
    </g>

    <g transform="translate(763 72)" filter="url(#shadow)">
      <rect width="183" height="52" rx="15" fill="#20251f" stroke="#3c493d"/>
      <circle cx="20" cy="26" r="6" fill="#65cc8e"/>
      <text x="36" y="23" fill="#9ba59a" font-size="11" font-weight="700" letter-spacing="1">CLEAN UP</text>
      <text x="36" y="40" fill="#f1f3ec" font-size="17" font-weight="750">14.8 GB</text>
    </g>

    <g transform="translate(1014 124)" filter="url(#shadow)">
      <rect width="148" height="52" rx="15" fill="#27251d" stroke="#52472d"/>
      <circle cx="20" cy="26" r="6" fill="#f3c969"/>
      <text x="36" y="23" fill="#aaa28b" font-size="11" font-weight="700" letter-spacing="1">OPTIONAL</text>
      <text x="36" y="40" fill="#f1f3ec" font-size="17" font-weight="750">11.2 GB</text>
    </g>

    <g transform="translate(1001 298)" filter="url(#shadow)">
      <rect width="161" height="52" rx="15" fill="#24212d" stroke="#4a415f"/>
      <circle cx="20" cy="26" r="6" fill="#b9a4ff"/>
      <text x="36" y="23" fill="#a9a1ba" font-size="11" font-weight="700" letter-spacing="1">KEEP</text>
      <text x="36" y="40" fill="#f1f3ec" font-size="17" font-weight="750">Protected</text>
    </g>
  </g>
</svg>
